name: Zdjęcia miejsc (Wikimedia Commons)

# Dobiera zdjęcia do miejsc na mapie (tylko wolne licencje, z autorem) i zapisuje je w aplikacji.
on:
  push:
    branches: [main]
    paths: ['scripts/miejsca_wiki.json', 'scripts/zdjecia_miejsc.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zdjecia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/zdjecia_miejsc.py
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add app/src/data/zdjeciaMiejsc.json
          git diff --cached --quiet || { git commit -m "Zdjęcia miejsc z Wikimedia Commons"; git pull --rebase; git push; }
