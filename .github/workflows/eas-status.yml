name: Stan budów (EAS)

# Wypisuje ostatnie budowy i aktualizacje — do diagnozy bez komputera.
on:
  push:
    branches: [main]
    paths: ['.github/status']
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: eas build:list --limit 6 --non-interactive --json | jq -r '.[] | [.platform, .status, .appVersion, .runtimeVersion, .createdAt, (.error.message // ""), (.artifacts.buildUrl // ""), .completedAt, .gitCommitHash, .channel, .runtimeVersion] | @tsv'
      - run: eas update:list --branch preview --limit 5 --non-interactive --json | jq -c '.currentPage[]? | {runtimeVersion, createdAt, platforms, group, gitCommitHash}' || true
      - run: eas channel:view preview --non-interactive --json | jq -c '.' | cut -c1-1500 || true
