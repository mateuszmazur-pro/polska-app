name: Aktualizacja w powietrzu (EAS Update)

# Po każdym pushu na main ze zmianami w aplikacji wysyła aktualizację
# do wersji testowej (kanał „preview”). Telefon pobiera ją przy ponownym otwarciu aplikacji.
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install --no-audit --no-fund

      - name: Wyślij aktualizację
        run: eas update --branch preview --message "${{ github.event.head_commit.message || 'Aktualizacja' }}" --non-interactive
